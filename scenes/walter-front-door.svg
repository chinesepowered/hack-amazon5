<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Illustrated doorbell-camera frame for the Night Door simulator (original artwork, no real people). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060d"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b140f"/>
      <stop offset="1" stop-color="#1a2a1d"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#6b6358"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.22" cy="0.05" r="0.95">
      <stop offset="0" stop-color="#ffd99c" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e3a65e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <pattern id="plaid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#2c4d8e"/>
      <rect y="10" width="30" height="8" fill="#5a7dc6" opacity="0.75"/>
      <rect x="10" width="8" height="30" fill="#5a7dc6" opacity="0.6"/>
      <rect y="13.5" width="30" height="2" fill="#e4ebf8" opacity="0.55"/>
      <rect x="13.5" width="2" height="30" fill="#e4ebf8" opacity="0.5"/>
    </pattern>
    <pattern id="planks" width="120" height="30" patternUnits="userSpaceOnUse">
      <rect width="120" height="30" fill="#6a5238"/>
      <rect y="27" width="120" height="3" fill="#3f3022"/>
      <rect x="118" width="2" height="30" fill="#4a3928"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.10 0"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#cdd6ff" opacity="0.55">
    <circle cx="210" cy="70" r="1.6"/><circle cx="420" cy="40" r="1.2"/><circle cx="760" cy="90" r="1.4"/>
    <circle cx="990" cy="50" r="1.2"/><circle cx="1110" cy="120" r="1.6"/><circle cx="560" cy="130" r="1"/>
  </g>

  <!-- houses across the street -->
  <g fill="#0b1020">
    <path d="M300 300 L300 235 L370 190 L440 235 L440 300 Z"/>
    <path d="M760 300 L760 240 L840 200 L920 240 L920 300 Z"/>
    <rect x="0" y="285" width="1280" height="30"/>
  </g>
  <rect x="345" y="252" width="22" height="18" fill="#2a2415"/>
  <!-- street and streetlight -->
  <rect x="0" y="300" width="1280" height="36" fill="#1a1e27"/>
  <rect x="1010" y="160" width="7" height="150" fill="#1e2536"/>
  <circle cx="1013" cy="158" r="70" fill="#ffd27a" opacity="0.09" filter="url(#blur)"/>
  <circle cx="1013" cy="158" r="9" fill="#ffe9b8"/>

  <!-- lawn, walkway, bushes -->
  <rect x="0" y="336" width="1280" height="300" fill="url(#lawn)"/>
  <path d="M598 336 L682 336 L830 560 L450 560 Z" fill="url(#walk)"/>
  <ellipse cx="300" cy="470" rx="190" ry="80" fill="#0c1a12"/>
  <ellipse cx="1010" cy="480" rx="210" ry="85" fill="#0c1a12"/>
  <ellipse cx="420" cy="430" rx="90" ry="45" fill="#10231a"/>
  <!-- mailbox -->
  <rect x="885" y="330" width="6" height="60" fill="#2b2b2b"/>
  <rect x="866" y="312" width="44" height="26" rx="10" fill="#3a3f48"/>

  <!-- steps -->
  <rect x="410" y="558" width="460" height="26" fill="#8a7a66"/>
  <rect x="410" y="582" width="460" height="6" fill="#4d4235"/>
  <rect x="380" y="588" width="520" height="26" fill="#978672"/>
  <rect x="380" y="612" width="520" height="6" fill="#524637"/>

  <!-- porch floor -->
  <rect x="0" y="618" width="1280" height="102" fill="url(#planks)"/>

  <!-- shadow on the walkway -->
  <ellipse cx="646" cy="540" rx="84" ry="12" fill="#000" opacity="0.45"/>

  <!-- person seen from behind, walking away from the door down the walkway, in a long plaid robe -->
  <g>
    <!-- far leg, stepping forward (further from camera, so higher and smaller) -->
    <rect x="652" y="440" width="26" height="80" rx="12" fill="#a4a8b3"/>
    <path d="M650 514 q15 -7 30 0 v9 q-15 5 -30 0 Z" fill="#6b4a2c"/>
    <!-- near leg, heel toward camera -->
    <rect x="604" y="452" width="32" height="92" rx="14" fill="#bdc1cb"/>
    <ellipse cx="620" cy="546" rx="24" ry="10" fill="#7b5533"/>
    <ellipse cx="620" cy="551" rx="21" ry="5" fill="#c9a37a"/>
    <!-- long robe -->
    <path d="M582 292 Q642 276 702 292 L734 492 Q642 510 550 492 Z" fill="url(#plaid)"/>
    <path d="M582 292 Q642 276 702 292 L734 492 Q642 510 550 492 Z" fill="#000" opacity="0.12"/>
    <line x1="642" y1="300" x2="642" y2="504" stroke="#1b3261" stroke-width="3" opacity="0.7"/>
    <!-- belt tie hanging at the side -->
    <path d="M552 396 L540 468 L552 471 L562 400 Z" fill="#1f3b73"/>
    <!-- sleeves, arms swinging -->
    <path d="M566 306 Q538 356 536 438 L566 446 Q570 372 592 314 Z" fill="url(#plaid)"/>
    <path d="M718 306 Q748 348 756 424 L728 434 Q716 368 694 314 Z" fill="url(#plaid)"/>
    <!-- shawl collar at the back of the neck -->
    <path d="M598 296 Q642 266 686 296 Q664 318 642 318 Q620 318 598 296 Z" fill="#23407a"/>
    <!-- back of head in a dark knit cap -->
    <ellipse cx="642" cy="254" rx="35" ry="39" fill="#2a2c35"/>
    <path d="M607 262 Q642 244 677 262 L677 276 Q642 262 607 276 Z" fill="#3a3d47"/>
  </g>

  <!-- porch light glow and posts -->
  <rect width="1280" height="720" fill="url(#lamp)"/>
  <rect x="140" y="0" width="48" height="640" fill="#d9d2c4"/>
  <rect x="140" y="0" width="12" height="640" fill="#fff" opacity="0.25"/>
  <rect x="1092" y="0" width="48" height="640" fill="#9e968a"/>

  <!-- camera vignette and grain -->
  <rect width="1280" height="720" fill="url(#vignette)"/>
  <rect width="1280" height="720" filter="url(#grain)" opacity="0.6"/>

  <!-- generic camera overlay (not Ring branding) -->
  <rect x="510" y="200" width="270" height="366" rx="6" fill="none" stroke="#7ee0b5" stroke-width="3" stroke-dasharray="14 8" opacity="0.8"/>
  <rect x="510" y="174" width="92" height="26" rx="4" fill="#7ee0b5" opacity="0.9"/>
  <text x="556" y="193" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#08130e" text-anchor="middle">person</text>
  <rect x="28" y="26" width="190" height="40" rx="20" fill="#000" opacity="0.55"/>
  <circle cx="54" cy="46" r="7" fill="#ff5a4e"/>
  <text x="72" y="53" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">Front Door</text>
  <rect x="1046" y="26" width="206" height="40" rx="20" fill="#000" opacity="0.55"/>
  <text x="1149" y="53" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fff" text-anchor="middle">02:14:07 AM</text>
  <text x="32" y="700" font-family="Arial, sans-serif" font-size="15" fill="#fff" opacity="0.7">Night Door simulator · illustrated camera image</text>
</svg>
